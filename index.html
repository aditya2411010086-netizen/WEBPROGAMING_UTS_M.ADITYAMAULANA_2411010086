<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Web Programing - Kalkulator</title>
    <!-- Menghubungkan file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Bagian Header dengan Nama dan NPM -->
    <header>
        <div class="logo">MY APP KALKULATOR ADIT - 2411010086</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Bagian Konten Utama -->
    <main>
        <div class="calculator-card">
            <h2>Operasi Matematika dengan JavaScript</h2>
            
            <div class="form-group">
                <label for="angka1">Angka Pertama:</label>
                <input type="number" id="angka1" placeholder="Masukkan angka pertama">
            </div>

            <div class="form-group">
                <label for="angka2">Angka Kedua:</label>
                <input type="number" id="angka2" placeholder="Masukkan angka kedua">
            </div>

            <div class="form-group">
                <label for="operasi">Pilih Operasi:</label>
                <select id="operasi">
                    <option value="tambah">Penjumlahan (+)</option>
                    <option value="kurang">Pengurangan (-)</option>
                    <option value="kali">Perkalian (×)</option>
                    <option value="bagi">Pembagian (÷)</option>
                </select>
            </div>

            <button onclick="hitung()">Hitung</button>

            <div class="result" id="hasil"></div>
        </div>
    </main>

    <!-- Bagian Footer -->
    <footer>
        &copy; 2026 My App, All Rights Reserved.
    </footer>

    <!-- Menghubungkan file JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
